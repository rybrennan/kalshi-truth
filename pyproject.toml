[project]
name = "kalshi-truth"
version = "0.2.0"
description = "Reconcile your real Kalshi P&L from raw fills + settlements, live and archived — the numbers your tracker gets wrong."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anchor 163 LLC" }]
keywords = ["kalshi", "prediction-markets", "pnl", "reconciliation", "accounting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "httpx>=0.24",
    "cryptography>=41",
]

[project.urls]
Homepage = "https://github.com/rybrennan/kalshi-truth"
"Kalshi API integration" = "https://anchor163.com/kalshi-api-integration/"

[project.scripts]
kalshi-truth = "kalshi_truth.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kalshi_truth"]
